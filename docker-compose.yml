version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: farmfriend-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: farmfriend
      MYSQL_USER: farmuser
      MYSQL_PASSWORD: farmuser_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_here"]
      timeout: 10s
      retries: 5
      interval: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmfriend-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: farmuser
      DB_PASSWORD: farmuser_secure_pass
      DB_NAME: farmfriend
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-production_farmfriend_jwt_secret_change_me_12345}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGMARK_API_KEY: ${AGMARK_API_KEY:-}
    ports:
      - "5000:5000"

volumes:
  mysql_data:
